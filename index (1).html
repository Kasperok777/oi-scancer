<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OI/Price Divergence Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #080c10;
    --surface: #0d1117;
    --border: #1c2535;
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --green: #00ff88;
    --red: #ff3366;
    --yellow: #ffd700;
    --text: #c9d1d9;
    --muted: #4a5568;
    --binance: #f0b90b;
    --bybit: #f7a600;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }

  .container { position: relative; z-index: 1; max-width: 1340px; margin: 0 auto; padding: 24px 16px; }

  header { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
  .logo-tag { font-size: 10px; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
  h1 { font-family: 'Syne', sans-serif; font-size: clamp(20px, 4vw, 28px); font-weight: 800; color: #fff; line-height: 1.1; }
  h1 span { color: var(--accent); }

  .refresh-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); padding: 4px 12px; border: 1px solid var(--border); border-radius: 20px; margin-top: 6px; }
  .refresh-badge.active { color: var(--green); border-color: rgba(0,255,136,0.3); }
  .countdown { font-weight: 700; color: var(--accent); min-width: 24px; }

  /* Controls */
  .controls { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin-bottom: 16px; }
  .control-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

  input[type="number"], select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--accent); font-family: 'Space Mono', monospace; font-size: 13px;
    padding: 7px 11px; outline: none; transition: border-color 0.2s;
  }
  input[type="number"] { width: 106px; }
  select { min-width: 128px; cursor: pointer; }
  input[type="number"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,229,255,0.1); }

  /* Pills generic */
  .pill-group { display: flex; flex-direction: column; gap: 5px; }
  .pills { display: flex; gap: 4px; flex-wrap: wrap; }
  .pill {
    padding: 6px 11px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); font-family: 'Space Mono', monospace;
    font-size: 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }

  /* Exchange toggles */
  .exch-pill { position: relative; }
  .exch-pill.binance.active { background: var(--binance); border-color: var(--binance); color: #000; }
  .exch-pill.bybit.active { background: #ff6b00; border-color: #ff6b00; color: #fff; }
  .exch-pill.binance:hover { border-color: var(--binance); color: var(--binance); }
  .exch-pill.bybit:hover { border-color: #ff6b00; color: #ff6b00; }

  .btn { padding: 8px 20px; border-radius: 6px; border: none; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { background: #33ecff; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,229,255,0.3); }
  .btn-primary:disabled { background: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary { background: transparent; color: var(--accent2); border: 1px solid var(--accent2); }
  .btn-secondary:hover { background: rgba(255,107,53,0.1); }

  /* Status */
  .status-bar { display: flex; align-items: center; gap: 10px; padding: 9px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; font-size: 12px; flex-wrap: wrap; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .status-dot.active { background: var(--green); animation: pulse 1.5s infinite; }
  .status-dot.loading { background: var(--yellow); animation: pulse 0.7s infinite; }
  .status-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
  .status-count { margin-left: auto; color: var(--muted); font-size: 11px; }
  .progress-bar { width: 100%; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; display: none; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 15px; }
  .stat-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .stat-value { font-family: 'Syne', sans-serif; font-size: 19px; font-weight: 800; color: var(--accent); }
  .stat-value.green { color: var(--green); }

  /* Table */
  .table-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
  .table-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; color: #fff; }
  .filter-tabs { display: flex; gap: 4px; }
  .tab { padding: 4px 11px; border-radius: 4px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); color: var(--muted); background: transparent; font-family: 'Space Mono', monospace; transition: all 0.15s; }
  .tab.active, .tab:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; }
  th { padding: 10px 12px; text-align: left; font-size: 10px; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--accent); }
  th.sorted { color: var(--accent); }
  th .sa { margin-left: 3px; opacity: 0.3; font-size: 9px; }
  th.sorted .sa { opacity: 1; }
  td { padding: 9px 12px; font-size: 12px; border-bottom: 1px solid rgba(28,37,53,0.5); vertical-align: middle; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(0,229,255,0.02); }

  .symbol-cell { display: flex; align-items: center; gap: 7px; }
  .symbol-icon { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--border), var(--surface)); display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: var(--accent); border: 1px solid var(--border); flex-shrink: 0; }
  .symbol-name { font-weight: 700; font-size: 13px; color: #fff; }
  .symbol-quote { font-size: 10px; color: var(--muted); }

  /* Exchange badge on row */
  .exch-tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: 1px; }
  .exch-tag.binance { background: rgba(240,185,11,0.15); color: var(--binance); }
  .exch-tag.bybit { background: rgba(255,107,0,0.15); color: #ff8c00; }

  .two-line { display: flex; flex-direction: column; gap: 1px; }
  .val-now { font-weight: 700; color: #fff; font-size: 12px; }
  .val-old { font-size: 10px; color: var(--muted); }

  .badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; }
  .badge-pos { background: rgba(0,255,136,0.1); color: var(--green); }
  .badge-neg { background: rgba(255,51,102,0.1); color: var(--red); }

  .ratio-bar-wrap { display: flex; align-items: center; gap: 7px; }
  .ratio-bar { width: 52px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .ratio-fill { height: 100%; background: var(--accent2); border-radius: 2px; }
  .ratio-val { font-weight: 700; color: var(--accent2); min-width: 28px; font-size: 12px; }

  .empty-state { text-align: center; padding: 56px 20px; color: var(--muted); }
  .empty-icon { font-size: 38px; margin-bottom: 10px; opacity: 0.3; }
  .empty-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; color: var(--text); margin-bottom: 5px; }
  .empty-sub { font-size: 12px; }

  @keyframes rowIn { from{background:rgba(0,229,255,0.07)}to{background:transparent} }
  tr.new-row td { animation: rowIn 2s ease-out; }

  @media (max-width: 680px) { .hide-mobile { display: none; } td, th { padding: 8px 7px; } }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <div class="logo-tag">Futures Scanner</div>
      <h1>OI / Price <span>Divergence</span></h1>
    </div>
    <div>
      <div class="refresh-badge" id="refreshBadge">
        <span>⟳</span>
        <span id="refreshLabel">вимкнено</span>
        <span class="countdown" id="countdown"></span>
      </div>
    </div>
  </header>

  <div class="controls">

    <!-- Exchange selector -->
    <div class="pill-group">
      <label>Біржа</label>
      <div class="pills">
        <button class="pill exch-pill binance active" id="exBinance" onclick="toggleExchange('binance')">🟡 Binance</button>
        <button class="pill exch-pill bybit active"   id="exBybit"   onclick="toggleExchange('bybit')">🟠 Bybit</button>
      </div>
    </div>

    <!-- Days -->
    <div class="pill-group">
      <label>Період (днів)</label>
      <div class="pills">
        <button class="pill" onclick="setDays(1,this)">1д</button>
        <button class="pill" onclick="setDays(3,this)">3д</button>
        <button class="pill active" onclick="setDays(7,this)">7д</button>
        <button class="pill" onclick="setDays(14,this)">14д</button>
        <button class="pill" onclick="setDays(30,this)">30д</button>
      </div>
    </div>

    <div class="control-group">
      <label>Мін. ріст OI (%)</label>
      <input type="number" id="minOI" value="5" min="0" step="1">
    </div>
    <div class="control-group">
      <label>Коеф. OI/Ціна ≥</label>
      <input type="number" id="minRatio" value="2" min="1" step="0.1">
    </div>
    <div class="control-group">
      <label>Мін. ціна USDT</label>
      <input type="number" id="minPrice" value="0.001" min="0" step="0.001">
    </div>
    <div class="control-group">
      <label>Мін. зміна ціни (%)</label>
      <input type="number" id="minPriceChange" value="1" min="0" step="0.5" title="Ігнорувати токени де ціна змінилась менше ніж на X% — щоб уникнути космічних коефіцієнтів">
    </div>
    <div class="control-group">
      <label>Авто-оновлення</label>
      <select id="autoRefresh">
        <option value="0" selected>Вимкнено</option>
        <option value="60">Кожну хвилину</option>
        <option value="300">Кожні 5 хв</option>
        <option value="600">Кожні 10 хв</option>
      </select>
    </div>

    <button class="btn btn-primary" id="scanBtn" onclick="startScan()">▶ СКАНУВАТИ</button>
    <button class="btn btn-secondary" onclick="exportCSV()">↓ CSV</button>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Натисни «Сканувати» для початку</span>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="status-count" id="statusCount"></span>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Binance токенів</div><div class="stat-value" id="statBinance">—</div></div>
    <div class="stat-card"><div class="stat-label">Bybit токенів</div><div class="stat-value" id="statBybit">—</div></div>
    <div class="stat-card"><div class="stat-label">Знайдено сигналів</div><div class="stat-value green" id="statSignals">—</div></div>
    <div class="stat-card"><div class="stat-label">Макс. коефіцієнт</div><div class="stat-value" id="statMaxRatio">—</div></div>
    <div class="stat-card"><div class="stat-label">Час сканування</div><div class="stat-value" id="statTime">—</div></div>
  </div>

  <div class="table-wrapper">
    <div class="table-header">
      <div class="table-title">📊 Результати <span id="periodLabel" style="color:var(--accent);font-size:12px;margin-left:6px;"></span></div>
      <div class="filter-tabs">
        <button class="tab active" onclick="setFilter('all',this)">Всі</button>
        <button class="tab" onclick="setFilter('long',this)">Лонг 📈</button>
        <button class="tab" onclick="setFilter('short',this)">Шорт 📉</button>
        <button class="tab" onclick="setFilter('binance',this)">🟡 Binance</button>
        <button class="tab" onclick="setFilter('bybit',this)">🟠 Bybit</button>
      </div>
    </div>
    <div id="tableBody">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">Дані відсутні</div>
        <div class="empty-sub">Обери біржі, період і натисни «Сканувати»</div>
      </div>
    </div>
  </div>

</div>
<script>
// ─── State ────────────────────────────────────────────────────
let allResults = [];
let currentFilter = 'all';
let sortField = 'ratio';
let sortDir = -1;
let selectedDays = 7;
let useExchange = { binance: true, bybit: true };
let autoRefreshTimer = null;
let countdownTimer = null;
let countdownVal = 0;
let scanStartTime = null;

// ─── Exchange toggle ──────────────────────────────────────────
function toggleExchange(ex) {
  // Don't allow both off
  const other = ex === 'binance' ? 'bybit' : 'binance';
  if (useExchange[ex] && !useExchange[other]) return; // can't turn off the only one active
  useExchange[ex] = !useExchange[ex];
  document.getElementById(ex === 'binance' ? 'exBinance' : 'exBybit')
    .classList.toggle('active', useExchange[ex]);
}

function setDays(d, el) {
  selectedDays = d;
  document.querySelectorAll('.pill:not(.exch-pill)').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
}

// ─── Helpers ──────────────────────────────────────────────────
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url.split('?')[0].split('/').slice(-2).join('/'));
  return r.json();
}

function fmtPrice(p) {
  if (!p && p !== 0) return '—';
  if (p < 0.0001) return p.toFixed(8);
  if (p < 0.01)   return p.toFixed(6);
  if (p < 1)      return p.toFixed(4);
  if (p < 100)    return p.toFixed(3);
  return p.toFixed(2);
}
function fmtOI(v) {
  if (!v) return '—';
  if (v >= 1e9) return (v/1e9).toFixed(2)+'B';
  if (v >= 1e6) return (v/1e6).toFixed(2)+'M';
  if (v >= 1e3) return (v/1e3).toFixed(1)+'K';
  return v.toFixed(0);
}
function fmtVol(v) {
  if (v > 1e9) return (v/1e9).toFixed(1)+'B';
  if (v > 1e6) return (v/1e6).toFixed(0)+'M';
  return (v/1e3).toFixed(0)+'K';
}
function dayWord(n) {
  if (n===1) return 'день';
  if (n>=2&&n<=4) return 'дні';
  return 'днів';
}

// ─── BINANCE API ──────────────────────────────────────────────
const BN = 'https://fapi.binance.com';

async function bnGetSymbols() {
  const d = await fetchJSON(BN+'/fapi/v1/exchangeInfo');
  return d.symbols
    .filter(s => {
      if (s.quoteAsset!=='USDT' || s.status!=='TRADING' || s.contractType!=='PERPETUAL') return false;
      // Exclude metals, commodities, indices (Binance uses underlyingType)
      const nonCrypto = ['COMMODITY','INDEX','DEFI'];
      if (s.underlyingType && nonCrypto.includes(s.underlyingType)) return false;
      // Explicit symbol blocklist just in case
      const blocked = ['XAUUSDT','XAGUSDT','BTCDOMUSDT','DEFIUSDT'];
      if (blocked.includes(s.symbol)) return false;
      return true;
    })
    .map(s => s.symbol);
}

async function bnGetTickers() {
  const d = await fetchJSON(BN+'/fapi/v1/ticker/24hr');
  const m = {};
  d.forEach(t => { m[t.symbol] = t; });
  return m;
}

async function bnGetPriceHistory(symbol, days) {
  const limit = Math.min(days+3, 499);
  const d = await fetchJSON(BN+'/fapi/v1/klines?symbol='+symbol+'&interval=1d&limit='+limit);
  if (!d||d.length<2) return null;
  const idx = Math.max(0, d.length-1-days);
  const priceThen = parseFloat(d[idx][1]);
  const priceNow  = parseFloat(d[d.length-1][4]);
  if (!priceThen||!priceNow) return null;
  // d[i][7] = quoteAssetVolume (USDT volume for that day)
  const volThen = parseFloat(d[idx][7]) || 0;
  const volNow  = parseFloat(d[d.length-1][7]) || 0;
  return {priceThen, priceNow, volThen, volNow};
}

async function bnGetOIHistory(symbol, days) {
  let period, bpd;
  if (days<=1){period='1h';bpd=24;}
  else if(days<=7){period='4h';bpd=6;}
  else {period='1d';bpd=1;}
  const limit = Math.min(days*bpd+4, 499);
  const d = await fetchJSON(BN+'/futures/data/openInterestHist?symbol='+symbol+'&period='+period+'&limit='+limit);
  if (!d||d.length<2) return null;
  const idx = Math.max(0, d.length-1-days*bpd);
  const oiThen = parseFloat(d[idx].sumOpenInterest);
  const oiNow  = parseFloat(d[d.length-1].sumOpenInterest);
  if (!oiThen||!oiNow) return null;
  return {oiThen, oiNow};
}

async function scanBinance(days, minOI, minRatio, minPrice, minPriceChange, onProgress) {
  const [symbols, tickers] = await Promise.all([bnGetSymbols(), bnGetTickers()]);
  const filtered = symbols.filter(s => {
    const t = tickers[s];
    return t && parseFloat(t.lastPrice) >= minPrice;
  });

  const results = [];
  const bsz = 8;
  for (let i=0;i<filtered.length;i+=bsz) {
    const batch = filtered.slice(i,i+bsz);
    onProgress(i, filtered.length, results.length);

    const batchRes = await Promise.allSettled(batch.map(async symbol => {
      const ticker = tickers[symbol];
      const [ph, oh] = await Promise.all([bnGetPriceHistory(symbol,days), bnGetOIHistory(symbol,days)]);
      if (!ph||!oh) return null;
      const priceChange = ((ph.priceNow-ph.priceThen)/ph.priceThen)*100;
      const oiChange    = ((oh.oiNow-oh.oiThen)/oh.oiThen)*100;
      if (oiChange<minOI) return null;
      if (Math.abs(priceChange)<Math.max(minPriceChange, 0.01)) return null;
      const ratio = oiChange/Math.abs(priceChange);
      if (ratio<minRatio) return null;
      const volChange = ph.volThen > 0 ? ((ph.volNow - ph.volThen) / ph.volThen) * 100 : 0;
      return {
        exchange:'binance', symbol,
        priceThen:ph.priceThen, priceNow:ph.priceNow, priceChange,
        oiThen:oh.oiThen, oiNow:oh.oiNow, oiChange,
        volThen:ph.volThen, volNow:ph.volNow, volChange: Math.round(volChange*10)/10,
        volume: parseFloat(ticker.quoteVolume),
        ratio: Math.round(ratio*10)/10,
        direction: priceChange>=0?'long':'short',
      };
    }));
    batchRes.forEach(r=>{ if(r.status==='fulfilled'&&r.value) results.push(r.value); });
    await new Promise(res=>setTimeout(res,120));
  }
  return {results, total: filtered.length};
}

// ─── BYBIT API ────────────────────────────────────────────────
const BB = 'https://api.bybit.com';

async function bbGetSymbols(minPrice) {
  // Bybit linear (USDT perp) instruments
  let symbols = [];
  let cursor = '';
  do {
    const url = BB+'/v5/market/instruments-info?category=linear&limit=1000'+(cursor?'&cursor='+cursor:'');
    const d = await fetchJSON(url);
    if (!d||d.retCode!==0) break;
    d.result.list
      .filter(s => {
        if (s.quoteCoin!=='USDT' || s.status!=='Trading' || s.contractType!=='LinearPerpetual') return false;
        // Bybit: metals end in no pattern but have specific symbols; stocks end with 'USD' as base or have long names
        // Best filter: exclude known non-crypto bases
        const base = s.baseCoin || '';
        const blocked = ['XAU','XAG','BTC.D','XAUUSDT','XAGUSDT'];
        if (blocked.includes(base) || blocked.includes(s.symbol)) return false;
        // Stocks on Bybit have baseCoin like 'AAPL', 'TSLA' etc — they contain no numbers and are >4 chars with uppercase only... 
        // More reliable: Bybit sets contractType differently for stocks, but to be safe exclude any symbol ending with 'USD' (not USDT)
        if (s.symbol.endsWith('USD') && !s.symbol.endsWith('USDT')) return false;
        return true;
      })
      .forEach(s => symbols.push(s.symbol));
    cursor = d.result.nextPageCursor||'';
  } while (cursor);
  return symbols;
}

async function bbGetTickers() {
  const d = await fetchJSON(BB+'/v5/market/tickers?category=linear');
  const m = {};
  if (d&&d.retCode===0) d.result.list.forEach(t=>{ m[t.symbol]=t; });
  return m;
}

async function bbGetPriceHistory(symbol, days) {
  const limit = Math.min(days+3, 499);
  const d = await fetchJSON(BB+'/v5/market/kline?category=linear&symbol='+symbol+'&interval=D&limit='+limit);
  if (!d||d.retCode!==0||!d.result.list||d.result.list.length<2) return null;
  // Bybit returns newest first; list[i] = [startTime, open, high, low, close, volume, turnover]
  const list = d.result.list.slice().reverse();
  const idx = Math.max(0, list.length-1-days);
  const priceThen = parseFloat(list[idx][1]); // open
  const priceNow  = parseFloat(list[list.length-1][4]); // close
  if (!priceThen||!priceNow) return null;
  // list[i][6] = turnover (quote volume in USDT)
  const volThen = parseFloat(list[idx][6]) || 0;
  const volNow  = parseFloat(list[list.length-1][6]) || 0;
  return {priceThen, priceNow, volThen, volNow};
}

async function bbGetOIHistory(symbol, days) {
  let period, bpd;
  if (days<=1){period='1h';bpd=24;}
  else if(days<=7){period='4h';bpd=6;}
  else {period='1d';bpd=1;}
  const limit = Math.min(days*bpd+4, 200);
  const d = await fetchJSON(BB+'/v5/market/open-interest?category=linear&symbol='+symbol+'&intervalTime='+period+'&limit='+limit);
  if (!d||d.retCode!==0||!d.result.list||d.result.list.length<2) return null;
  // Bybit returns newest first
  const list = d.result.list.slice().reverse();
  const idx = Math.max(0, list.length-1-days*bpd);
  const oiThen = parseFloat(list[idx].openInterest);
  const oiNow  = parseFloat(list[list.length-1].openInterest);
  if (!oiThen||!oiNow) return null;
  return {oiThen, oiNow};
}

async function scanBybit(days, minOI, minRatio, minPrice, minPriceChange, onProgress) {
  const [symbols, tickers] = await Promise.all([bbGetSymbols(), bbGetTickers()]);
  const filtered = symbols.filter(s => {
    const t = tickers[s];
    return t && parseFloat(t.lastPrice||0) >= minPrice;
  });

  const results = [];
  const bsz = 6; // slower to avoid Bybit rate limits
  for (let i=0;i<filtered.length;i+=bsz) {
    const batch = filtered.slice(i,i+bsz);
    onProgress(i, filtered.length, results.length);

    const batchRes = await Promise.allSettled(batch.map(async symbol => {
      const ticker = tickers[symbol];
      const [ph, oh] = await Promise.all([bbGetPriceHistory(symbol,days), bbGetOIHistory(symbol,days)]);
      if (!ph||!oh) return null;
      const priceChange = ((ph.priceNow-ph.priceThen)/ph.priceThen)*100;
      const oiChange    = ((oh.oiNow-oh.oiThen)/oh.oiThen)*100;
      if (oiChange<minOI) return null;
      if (Math.abs(priceChange)<Math.max(minPriceChange, 0.01)) return null;
      const ratio = oiChange/Math.abs(priceChange);
      if (ratio<minRatio) return null;
      const volChange = ph.volThen > 0 ? ((ph.volNow - ph.volThen) / ph.volThen) * 100 : 0;
      return {
        exchange:'bybit', symbol,
        priceThen:ph.priceThen, priceNow:ph.priceNow, priceChange,
        oiThen:oh.oiThen, oiNow:oh.oiNow, oiChange,
        volThen:ph.volThen, volNow:ph.volNow, volChange: Math.round(volChange*10)/10,
        volume: parseFloat(ticker.turnover24h||0),
        ratio: Math.round(ratio*10)/10,
        direction: priceChange>=0?'long':'short',
      };
    }));
    batchRes.forEach(r=>{ if(r.status==='fulfilled'&&r.value) results.push(r.value); });
    await new Promise(res=>setTimeout(res,180));
  }
  return {results, total: filtered.length};
}

// ─── Main scan ────────────────────────────────────────────────
async function startScan() {
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.textContent = '⏳ СКАНУВАННЯ...';

  const minOI          = parseFloat(document.getElementById('minOI').value)||0;
  const minRatio       = parseFloat(document.getElementById('minRatio').value)||2;
  const minPrice       = parseFloat(document.getElementById('minPrice').value)||0;
  const minPriceChange = parseFloat(document.getElementById('minPriceChange').value)||0;
  const days = selectedDays;

  document.getElementById('periodLabel').textContent = 'за '+days+' '+dayWord(days);
  setStatus('loading','Ініціалізація...');
  showProgress(true,0);
  scanStartTime = Date.now();

  // Reset stats
  ['statBinance','statBybit','statSignals','statMaxRatio','statTime'].forEach(id=>{
    document.getElementById(id).textContent='—';
  });

  let bnResults=[], bbResults=[], bnTotal=0, bbTotal=0;

  try {
    if (useExchange.binance && useExchange.bybit) {
      // Run both — first Binance, then Bybit sequentially to avoid CORS conflicts
      setStatus('loading','Сканування Binance...');
      const bnScan = await scanBinance(days,minOI,minRatio,minPrice,minPriceChange,(i,total,found)=>{
        showProgress(true, Math.round((i/total)*50));
        document.getElementById('statusText').textContent='Binance: '+i+'/'+total+'...';
        document.getElementById('statusCount').textContent='знайдено: '+found;
      });
      bnResults = bnScan.results;
      bnTotal   = bnScan.total;
      document.getElementById('statBinance').textContent = bnScan.results.length+'/'+bnScan.total;

      setStatus('loading','Сканування Bybit...');
      const bbScan = await scanBybit(days,minOI,minRatio,minPrice,minPriceChange,(i,total,found)=>{
        showProgress(true, 50+Math.round((i/total)*50));
        document.getElementById('statusText').textContent='Bybit: '+i+'/'+total+'...';
        document.getElementById('statusCount').textContent='знайдено: '+found;
      });
      bbResults = bbScan.results;
      bbTotal   = bbScan.total;
      document.getElementById('statBybit').textContent = bbScan.results.length+'/'+bbScan.total;

    } else if (useExchange.binance) {
      setStatus('loading','Сканування Binance...');
      const s = await scanBinance(days,minOI,minRatio,minPrice,minPriceChange,(i,total,found)=>{
        showProgress(true,Math.round((i/total)*100));
        document.getElementById('statusText').textContent='Binance: '+i+'/'+total+'...';
        document.getElementById('statusCount').textContent='знайдено: '+found;
      });
      bnResults=s.results; bnTotal=s.total;
      document.getElementById('statBinance').textContent=s.results.length+'/'+s.total;
      document.getElementById('statBybit').textContent='вимк.';
    } else {
      setStatus('loading','Сканування Bybit...');
      const s = await scanBybit(days,minOI,minRatio,minPrice,minPriceChange,(i,total,found)=>{
        showProgress(true,Math.round((i/total)*100));
        document.getElementById('statusText').textContent='Bybit: '+i+'/'+total+'...';
        document.getElementById('statusCount').textContent='знайдено: '+found;
      });
      bbResults=s.results; bbTotal=s.total;
      document.getElementById('statBybit').textContent=s.results.length+'/'+s.total;
      document.getElementById('statBinance').textContent='вимк.';
    }

    allResults = [...bnResults, ...bbResults];
    const elapsed = ((Date.now()-scanStartTime)/1000).toFixed(1);

    document.getElementById('statSignals').textContent = allResults.length;
    const maxR = allResults.length ? Math.max(...allResults.map(r=>r.ratio)) : 0;
    document.getElementById('statMaxRatio').textContent = maxR ? 'x'+maxR : '—';
    document.getElementById('statTime').textContent = elapsed+'s';

    renderTable();
    setStatus('active','Знайдено '+allResults.length+' сигналів · '+new Date().toLocaleTimeString('uk'));
    showProgress(false,100);

  } catch(err) {
    setStatus('error','Помилка: '+err.message);
    showProgress(false,0);
    console.error(err);
  }

  btn.disabled=false;
  btn.textContent='▶ СКАНУВАТИ';
  setupAutoRefresh();
}

// ─── Table render ─────────────────────────────────────────────
function renderTable() {
  let data = allResults.filter(r=>{
    if (currentFilter==='long')    return r.direction==='long';
    if (currentFilter==='short')   return r.direction==='short';
    if (currentFilter==='binance') return r.exchange==='binance';
    if (currentFilter==='bybit')   return r.exchange==='bybit';
    return true;
  });

  if (sortField==='symbol') data.sort((a,b)=>sortDir*a.symbol.localeCompare(b.symbol));
  else                       data.sort((a,b)=>sortDir*(a[sortField]-b[sortField]));

  if (!data.length) {
    document.getElementById('tableBody').innerHTML=
      '<div class="empty-state"><div class="empty-icon">🔍</div>'
      +'<div class="empty-title">Нічого не знайдено</div>'
      +'<div class="empty-sub">Спробуй знизити пороги або змінити період</div></div>';
    return;
  }

  const maxRatio = Math.max(...data.map(r=>r.ratio));
  const days = selectedDays;
  const dshort = days+'д';

  const rows = data.map(r=>{
    const pSign  = r.priceChange>=0?'+':'';
    const oiSign = r.oiChange>=0?'+':'';
    const pCls   = r.priceChange>=0?'badge-pos':'badge-neg';
    const oCls   = r.oiChange>=0?'badge-pos':'badge-neg';
    const barW   = Math.min(100,(r.ratio/maxRatio)*100).toFixed(0);
    const sym    = r.symbol.replace('USDT','').replace('-PERP','');
    const dir    = r.direction==='long'?'📈':'📉';
    const exTag  = r.exchange==='binance'
      ? '<span class="exch-tag binance">BNCE</span>'
      : '<span class="exch-tag bybit">BYBT</span>';

      const vSign = r.volChange>=0?'+':'';
      const vCls  = r.volChange>=0?'badge-pos':'badge-neg';
      return '<tr class="new-row">'
      +'<td><div class="symbol-cell">'
      +'<div class="symbol-icon">'+sym.slice(0,3)+'</div>'
      +'<div><div class="symbol-name">'+sym+'</div><div class="symbol-quote">'+exTag+'</div></div>'
      +'</div></td>'
      +'<td><div class="two-line"><div class="val-now">$'+fmtPrice(r.priceNow)+'</div>'
      +'<div class="val-old">$'+fmtPrice(r.priceThen)+' ← '+dshort+' тому</div></div></td>'
      +'<td><span class="badge '+pCls+'">'+pSign+r.priceChange.toFixed(2)+'%</span></td>'
      +'<td><div class="two-line"><div class="val-now">'+fmtOI(r.oiNow)+'</div>'
      +'<div class="val-old">'+fmtOI(r.oiThen)+' ← '+dshort+' тому</div></div></td>'
      +'<td><span class="badge '+oCls+'">'+oiSign+r.oiChange.toFixed(2)+'%</span></td>'
      +'<td><div class="ratio-bar-wrap">'
      +'<div class="ratio-bar"><div class="ratio-fill" style="width:'+barW+'%"></div></div>'
      +'<span class="ratio-val">x'+r.ratio+'</span></div></td>'
      +'<td class="hide-mobile"><div class="two-line">'
      +'<div class="val-now">'+fmtVol(r.volNow||r.volume)+'</div>'
      +'<div class="val-old">'+fmtVol(r.volThen)+' ← '+dshort+' тому</div>'
      +'</div></td>'
      +'<td class="hide-mobile"><span class="badge '+vCls+'">'+vSign+(r.volChange||0).toFixed(1)+'%</span></td>'
      +'<td>'+dir+'</td>'
      +'</tr>';
  }).join('');

  function thC(f){return sortField===f?'sorted':'';}

  document.getElementById('tableBody').innerHTML=
    '<table><thead><tr>'
    +'<th onclick="sortBy(\'symbol\')" class="'+thC('symbol')+'">Токен <span class="sa">⇅</span></th>'
    +'<th onclick="sortBy(\'priceNow\')" class="'+thC('priceNow')+'">Ціна (зараз / '+days+'д тому) <span class="sa">⇅</span></th>'
    +'<th onclick="sortBy(\'priceChange\')" class="'+thC('priceChange')+'">Ціна Δ% <span class="sa">⇅</span></th>'
    +'<th onclick="sortBy(\'oiNow\')" class="'+thC('oiNow')+'">OI (зараз / '+days+'д тому) <span class="sa">⇅</span></th>'
    +'<th onclick="sortBy(\'oiChange\')" class="'+thC('oiChange')+'">OI Δ% <span class="sa">⇅</span></th>'
    +'<th onclick="sortBy(\'ratio\')" class="'+thC('ratio')+'">OI/Ціна x <span class="sa">⇅</span></th>'
    +'<th class="hide-mobile" onclick="sortBy(\'volNow\')">Обʼєм (зараз / '+days+'д тому) <span class="sa">⇅</span></th>'
    +'<th class="hide-mobile" onclick="sortBy(\'volChange\')">Обʼєм Δ% <span class="sa">⇅</span></th>'
    +'<th>Напр.</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table>';
}

// ─── UI helpers ───────────────────────────────────────────────
function setStatus(type,text){
  document.getElementById('statusDot').className='status-dot '+type;
  document.getElementById('statusText').textContent=text;
}
function showProgress(show,pct){
  document.getElementById('progressBar').style.display=show?'block':'none';
  document.getElementById('progressFill').style.width=pct+'%';
}
function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}
function sortBy(field){
  if(sortField===field) sortDir*=-1;
  else{sortField=field;sortDir=-1;}
  renderTable();
}
function exportCSV(){
  if(!allResults.length){alert('Немає даних');return;}
  const h='Exchange,Symbol,PriceNow,PriceThen,PriceChange%,OINow,OIThen,OIChange%,Ratio,VolNow,VolThen,VolChange%,Direction';
  const rows=allResults.map(r=>
    r.exchange+','+r.symbol+','+r.priceNow+','+r.priceThen+','+r.priceChange.toFixed(2)+','
    +r.oiNow+','+r.oiThen+','+r.oiChange.toFixed(2)+','+r.ratio+','+(r.volNow||r.volume).toFixed(0)+','+(r.volThen||0).toFixed(0)+','+(r.volChange||0).toFixed(1)+','+r.direction
  );
  const blob=new Blob([[h,...rows].join('\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='oi_scan_'+selectedDays+'d_'+new Date().toISOString().slice(0,16)+'.csv';
  a.click();
}
function setupAutoRefresh(){
  clearInterval(autoRefreshTimer); clearInterval(countdownTimer);
  const secs=parseInt(document.getElementById('autoRefresh').value);
  const badge=document.getElementById('refreshBadge');
  if(!secs){
    badge.className='refresh-badge';
    document.getElementById('refreshLabel').textContent='вимкнено';
    document.getElementById('countdown').textContent='';
    return;
  }
  badge.className='refresh-badge active';
  document.getElementById('refreshLabel').textContent='оновлення через';
  countdownVal=secs;
  const fmt=v=>{const m=Math.floor(v/60),s=v%60;return m>0?m+':'+String(s).padStart(2,'0'):s+'s';};
  document.getElementById('countdown').textContent=fmt(secs);
  countdownTimer=setInterval(()=>{
    countdownVal--;
    document.getElementById('countdown').textContent=fmt(Math.max(0,countdownVal));
    if(countdownVal<=0)countdownVal=secs;
  },1000);
  autoRefreshTimer=setInterval(()=>{countdownVal=secs;startScan();},secs*1000);
}
